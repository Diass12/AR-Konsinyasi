name: Build AR Konsinyasi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract Cloud Build package
        run: |
          mkdir -p project
          unzip -q AR_Konsinyasi_CLOUD_BUILD_V12.zip -d project

      - name: Extract Android project
        run: |
          unzip -q project/cloudbuild/AR_Konsinyasi_Aplikasi_FINAL_V12.zip -d project/appsource

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: project/appsource/AR_Konsinyasi_Aplikasi/apk
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AR-Konsinyasi-V12-APK
          path: project/appsource/AR_Konsinyasi_Aplikasi/apk/app/build/outputs/apk/debug/*.apk
